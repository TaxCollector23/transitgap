name: TransitGap checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_data:
        description: Download county OSM/VTA data and run integration and browser checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e . pytest
      - run: python -m pytest backend/tests -m 'not integration' -q --disable-warnings
      - run: npm ci && npm run build
        working-directory: frontend
      - run: git diff --check
  real-data:
    if: github.event_name == 'workflow_dispatch' && inputs.real_data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRANSITGAP_PYTHON: python
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e . pytest
      - run: python scripts/prepare_deployment_data.py
      - run: python -m pytest backend/tests -q --disable-warnings
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-artifacts/
          retention-days: 7
