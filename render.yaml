services:
  - type: web
    name: transitgap-county
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install . && python scripts/prepare_deployment_data.py && cd frontend && npm ci && npm run build
    startCommand: uvicorn index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TRANSITGAP_REGION
        value: santa_clara_county
      - key: CORS_ORIGINS
        value: https://transitgap.vercel.app
      - key: MCP_ALLOWED_HOSTS
        value: transitgap-county.onrender.com,transitgap-county.onrender.com:*
      - key: MCP_ALLOWED_ORIGINS
        value: https://transitgap.vercel.app
