name: Backend health monitor
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-health-monitor
  cancel-in-progress: false
jobs:
  health:
    if: vars.TRANSITGAP_MONITOR_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TRANSITGAP_API_URL: ${{ vars.TRANSITGAP_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/monitor_backend.py
