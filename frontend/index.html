<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta
      name="description"
      content="Measure mobility detours and missing accessibility evidence on journeys to VTA stops across Santa Clara County."
    />
    <meta
      property="og:title"
      content="TransitGap | See the gaps in transit access"
    />
    <meta
      property="og:description"
      content="Compare mobility routes, inspect the evidence, and explore ten-minute access gaps at real VTA stops."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://transitgap.vercel.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <title>TransitGap | Transit access, with evidence</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-app-loading" style="display:none;min-height:100dvh;place-items:center;padding:28px;background:#fffefa;text-align:center;font-family:Inter,system-ui,sans-serif;color:#202722">
        <div role="status"><h1 style="font-size:28px">Opening TransitGap</h1><p>Loading the route planner…</p><a href="/" style="color:#176b5b">Back to home</a></div>
      </div>
    </div>
    <script>
      if (location.pathname !== "/") document.getElementById("initial-app-loading").style.display = "grid";
    </script>
    <noscript
      ><main>
        <h1>A city for all.</h1>
        <p>
          TransitGap compares walking routes to VTA stops across Santa Clara
          County and shows where accessibility information is mapped or missing.
          No route is independently verified accessible.
        </p>
        <p>
          Enable JavaScript to explore the map.
          <a href="https://github.com/TaxCollector23/transitgap"
            >Read the source and methods</a
          >.
        </p>
      </main></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
